<style>
:root{--font:"Plus Jakarta Sans",system-ui,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--bg1:#eaf1ff;--bg2:#fbfdff;--card:#fff;--tx:#0f1b3d;--mut:#5b6b8c;--ln:#e1e8f5;--ac:#1f56e0;--acs:#e6eeff;--ok:#12915a;--oks:#e0f6ec;--wn:#b85f00;--wns:#fff1dc;--bad:#c62a35;--bads:#fde8ea;
 --navy:#0b2a6f;--navy2:#0a2058;--or1:#ff7a18;--or2:#ffb347;--shadow:0 6px 20px rgba(15,40,110,.08);--hi:#e9f0ff;
 --p-tin_ai:#2f6fed;--p-thu_thuat:#8a4fd8;--p-huong_dan:#17935a;--p-thao_luan:#d9730d;--p-cau_hinh:#0f8f9c;--p-case:#6b7686}
@media(prefers-color-scheme:dark){:root{--bg1:#0a1226;--bg2:#0d1730;--card:#121c36;--tx:#e7edfb;--mut:#93a3c4;--ln:#24335a;--ac:#7aa5ff;--acs:#182a57;--ok:#5fd093;--oks:#143127;--wn:#f0b45a;--wns:#3a2a10;--bad:#ff7b80;--bads:#3a1c1e;
 --shadow:0 6px 20px rgba(0,0,0,.35);--hi:#182a57;--p-tin_ai:#6ea0ff;--p-thu_thuat:#b68bf0;--p-huong_dan:#4cc98a;--p-thao_luan:#f0a04b;--p-cau_hinh:#4fc3d0;--p-case:#97a2b0}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--tx);font:15px/1.55 var(--font);background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg1));background-attachment:fixed}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh;overflow-x:clip}
/* sidebar */
.side{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding:16px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 14px}
.logo{width:40px;height:40px;border-radius:12px;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;flex:none}
.brand b{display:block;font-size:.98rem;letter-spacing:.3px}.brand span{font-size:.72rem;opacity:.75;line-height:1.2;display:block}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:rgba(255,255,255,.88);padding:11px 12px;border-radius:12px;cursor:pointer;font:inherit;font-weight:600;letter-spacing:.2px;text-align:left}
.nav button:hover{background:rgba(255,255,255,.1)}
.nav button.on{background:#fff;color:var(--navy)}
.nav .badge{margin-left:auto;background:var(--or1);color:#fff;font-size:.72rem;border-radius:999px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.side .grow{flex:1}
.sidecard{background:rgba(255,255,255,.1);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:.8rem}
.sidecard .st{display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#7a8bb3;flex:none}.dot.ok{background:#4ade80}.dot.wn{background:#fbbf24}
.sidecard button{border:0;background:#fff;color:var(--navy);font:inherit;font-weight:700;border-radius:10px;padding:8px;cursor:pointer}
.sidecard button:disabled{opacity:.5;cursor:not-allowed}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
.top .tt b{font-size:1rem}.top .tt span{display:block;font-size:.78rem;color:var(--mut)}
.top .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bell{position:relative;border:1px solid var(--ln);background:var(--card);color:var(--tx);width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bell i{position:absolute;top:-3px;right:-3px;background:var(--or1);color:#fff;font:700 .68rem/1 var(--font);border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-style:normal;padding:0 4px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:7px 14px;font-size:.82rem;color:var(--mut)}
.chip b{color:var(--tx)}
.content{padding:24px 28px 60px;width:100%}
.page h1{margin:0;font-size:2.1rem;line-height:1.35;padding:.12em 0 .04em;letter-spacing:.5px;font-weight:800;background:linear-gradient(90deg,var(--navy),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
@media(prefers-color-scheme:dark){.page h1{background:linear-gradient(90deg,#9bbcff,#6ea0ff);-webkit-background-clip:text;background-clip:text}}
.page .sub{margin:4px 0 18px;color:var(--mut)}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
/* khối chung */
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:.95rem;letter-spacing:.2px}
.tag{display:inline-block;border:1px solid var(--ln);border-radius:999px;padding:1px 10px;font-size:.76rem;color:var(--mut);white-space:nowrap;background:var(--card)}
.t-ok{color:var(--ok);border-color:transparent;background:var(--oks)}.t-wn{color:var(--wn);border-color:transparent;background:var(--wns)}.t-bad{color:var(--bad);border-color:transparent;background:var(--bads)}.t-ac{color:var(--ac);border-color:transparent;background:var(--acs)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;color:var(--tx);border:1px solid var(--ln);border-radius:999px;padding:1px 10px;white-space:nowrap;background:var(--card);text-transform:uppercase;letter-spacing:.3px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc,var(--mut))}
button.b{font:inherit;font-size:.86rem;cursor:pointer;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 16px}
button.b:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}button.b:disabled{opacity:.45;cursor:not-allowed}
button.b.pri{background:var(--ac);border-color:var(--ac);color:#fff}button.b.pri:hover:not(:disabled){filter:brightness(1.08);color:#fff}
button.b.ok{background:var(--ok);border-color:var(--ok);color:#fff}button.b.ok:hover:not(:disabled){color:#fff;filter:brightness(1.08)}
button.b.no{color:var(--bad);border-color:var(--bad)}button.b.no:hover:not(:disabled){background:var(--bad);color:#fff}
button.b.on{background:var(--navy);border-color:var(--navy);color:#fff}
button.b.sm{font-size:.78rem;padding:3px 12px}
pre{margin:0;white-space:pre-wrap;word-wrap:break-word;font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mut);font-size:.85rem}
.empty{color:var(--mut);padding:22px;text-align:center}
.bar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.log{background:var(--bg1);border:1px solid var(--ln);border-radius:10px;padding:10px;max-height:340px;overflow:auto;font:12.5px/1.5 var(--mono);white-space:pre-wrap}
details summary{cursor:pointer;color:var(--mut)}
a{color:var(--ac);word-break:break-all}
select.f,input.f{font:inherit;font-size:.86rem;padding:7px 12px;border:1px solid var(--ln);border-radius:999px;background:var(--card);color:var(--tx)}
input.f{min-width:200px}
/* banner + giai đoạn */
.banner{display:flex;align-items:center;gap:16px;padding:20px 24px;border-radius:18px;color:#fff;background:linear-gradient(90deg,var(--or1),var(--or2));box-shadow:0 8px 24px rgba(255,122,24,.25);margin-bottom:16px}
.banner.blue{background:linear-gradient(90deg,var(--navy),var(--ac));box-shadow:0 8px 24px rgba(31,86,224,.25)}
.banner.green{background:linear-gradient(90deg,#0f9d63,#38c98a);box-shadow:0 8px 24px rgba(18,145,90,.22)}
.banner .ic{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex:none}
.banner .tx{flex:1;min-width:0}.banner .tx b{display:block;font-size:1.15rem}.banner .tx span{font-size:.88rem;opacity:.92}
.banner button{border:0;background:#fff;color:var(--navy);font:inherit;font-weight:700;border-radius:999px;padding:10px 20px;cursor:pointer;white-space:nowrap}
.banner button:disabled{opacity:.6;cursor:not-allowed}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:18px}
.stage{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .1s}
.stage:hover{transform:translateY(-2px)}
.stage .top2{display:flex;justify-content:space-between;align-items:center}
.stage .sic{width:38px;height:38px;border-radius:12px;background:var(--acs);color:var(--ac);display:flex;align-items:center;justify-content:center}
.stage .n{font-size:1.9rem;font-weight:800;color:var(--mut);line-height:1}
.stage .l{font-weight:600}
.stage.cur{border-color:var(--or1);background:linear-gradient(180deg,var(--wns),var(--card))}
.stage.cur .sic{background:var(--or1);color:#fff}.stage.cur .n{color:var(--or1)}
.stage.fin .n{color:var(--ok)}.stage.fin .sic{background:var(--oks);color:var(--ok)}
.stage.has .n{color:var(--tx)}
/* bảng tiến độ */
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;min-width:900px}
.tbl th{text-align:left;color:var(--mut);font-size:.74rem;letter-spacing:.6px;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--ln)}
.tbl td{padding:12px;border-bottom:1px solid var(--ln);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}.tbl tr.today td{background:var(--hi)}
.dbadge{display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--ln);border-radius:12px;padding:5px 10px;background:var(--card);min-width:62px}
.dbadge b{color:var(--ac);font-size:1rem;line-height:1.2}.dbadge span{font-size:.7rem;color:var(--mut)}
.title{font-weight:700;margin-bottom:5px;max-width:420px}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;min-width:260px}
.seg{height:6px;border-radius:3px;background:var(--ln)}.seg.done{background:var(--ac)}.seg.cur{background:var(--or1)}.seg.curA{background:#8fb0f5}.seg.bad{background:var(--bad)}.seg.fin{background:var(--ok)}
.segl{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;font-size:.66rem;color:var(--mut);text-align:center;margin:3px 0 7px}
.state{display:inline-block;border:1px solid var(--ln);border-radius:999px;padding:2px 12px;font-size:.8rem;font-weight:600}
.state.or{color:var(--wn);background:var(--wns);border-color:var(--or2)}.state.gr{color:var(--ok);background:var(--oks);border-color:transparent}.state.rd{color:var(--bad);background:var(--bads);border-color:transparent}
.state.bl{color:var(--ac);background:var(--acs);border-color:transparent}
/* lịch tuần */
.cal{overflow-x:auto}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;min-width:1090px;margin-bottom:12px}
.day{border:1px solid var(--ln);border-radius:12px;padding:8px;background:var(--card);min-height:120px}
.day.today{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}.day.out{opacity:.5}
.day .dh{font-size:.78rem;color:var(--mut);margin-bottom:6px;font-weight:700}
.slot{border:1px solid var(--ln);border-left:4px solid var(--pc,var(--mut));border-radius:10px;padding:6px 8px;margin-bottom:6px;font-size:.82rem;cursor:pointer;background:var(--bg2)}
.slot:hover{border-color:var(--ac)}.slot .st{display:flex;justify-content:space-between;gap:4px;margin-bottom:3px;align-items:center;flex-wrap:wrap}
.slot .tag{font-size:.7rem;padding:0 7px}
.slot .an{color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.slot.open .an{-webkit-line-clamp:unset}
/* bài nháp */
.cap{border:1px solid var(--ln);border-radius:12px;padding:10px;background:var(--bg2)}
.cap label{display:flex;gap:6px;font-weight:600;margin-bottom:6px;cursor:pointer;align-items:center}
textarea.ed{width:100%;min-height:180px;resize:vertical;font:inherit;line-height:1.5;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px}
textarea.ed:disabled{background:transparent;border-color:transparent;padding:0}
.focus{animation:fl 1.6s ease 1}@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--ac)}100%{box-shadow:var(--shadow)}}
.dayh{margin:12px 0 2px;font-weight:800;color:var(--mut);letter-spacing:.4px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
/* markdown */
.md h2,.md h3,.md h4,.md h5{margin:16px 0 6px}.md p{margin:6px 0}.md table{width:100%;border-collapse:collapse;margin:8px 0;border:1px solid var(--ln)}.md th,.md td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--ln)}
.md code{background:var(--bg1);padding:1px 5px;border-radius:4px}.md pre.code{background:var(--bg1);padding:10px;border-radius:8px}.md ul,.md ol{margin:6px 0;padding-left:22px}.md hr{border:0;border-top:1px solid var(--ln)}
.rep{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi .n{font-size:1.9rem;font-weight:800;line-height:1.1}.kpi .l{color:var(--mut);font-size:.85rem}
.ico{display:inline-flex}.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}.side{position:static;height:auto;flex-direction:column}
 .nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap;padding:9px 12px}.side .grow,.sidecard{display:none}
 .content{padding:18px 14px 50px}.top{padding:10px 14px}.rep{grid-template-columns:1fr}.banner{flex-wrap:wrap}.page h1{font-size:1.6rem}
}

 var eye=h("button",{type:"button",title:"Hiện/ẩn mật khẩu",onclick:function(){inp.type=inp.type==="password"?"text":"password"}},"👁");
 return{input:inp,wrap:h("div",{class:"pw"},[inp,eye])}}
function showLoginGate(prefill,note){
 var email=h("input",{type:"email",id:"lg-email",autocomplete:"email",required:"required",value:prefill||""}),pw=pwField("lg-pw"),err=h("div",{class:"err",style:"display:none"}),ok=h("div",{class:"okm",style:"display:none"}),btn=h("button",{type:"submit",class:"go"},"Đăng nhập");
 if(note){ok.style.display="block";ok.textContent=note}
 var forgot=h("a",{class:"fg",onclick:function(){var em=email.value.trim();err.style.display="none";
   if(!em){err.style.display="block";err.textContent="Nhập email của bạn ở ô Email rồi bấm lại “Quên mật khẩu?”.";return}
   sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname}).then(function(){ok.style.display="block";ok.textContent="Nếu email thuộc tài khoản nhân viên, bạn sẽ nhận được email hướng dẫn đặt lại mật khẩu."})}},"Quên mật khẩu?");
 var f=h("form",{onsubmit:function(e){e.preventDefault();err.style.display="none";btn.disabled=true;btn.textContent="Đang đăng nhập…";
   sb.auth.signInWithPassword({email:email.value.trim(),password:pw.input.value}).then(function(r){
    btn.disabled=false;btn.textContent="Đăng nhập";
    if(r.error){err.style.display="block";err.textContent="Email hoặc mật khẩu không đúng."}   /* thông báo chung, không lộ email nào tồn tại */
   })}},[
  h("label",{for:"lg-email"},"Email"),email,
  h("label",{for:"lg-pw",style:"margin-top:16px"},["Mật khẩu",forgot]),pw.wrap,
  err,ok,btn]);
 lgShell([f])}
function showNewPassword(){
 var a=pwField("lg-new","Mật khẩu mới (từ 10 ký tự)"),b=pwField("lg-new2","Nhập lại mật khẩu mới"),err=h("div",{class:"err",style:"display:none"}),btn=h("button",{type:"submit",class:"go"},"Lưu mật khẩu mới");
 var f=h("form",{onsubmit:function(e){e.preventDefault();err.style.display="none";
   if(a.input.value.length<10){err.style.display="block";err.textContent="Mật khẩu cần ít nhất 10 ký tự.";return}
   if(a.input.value!==b.input.value){err.style.display="block";err.textContent="Hai mật khẩu không khớp.";return}
   btn.disabled=true;
   sb.auth.updateUser({password:a.input.value}).then(function(r){btn.disabled=false;
    if(r.error){err.style.display="block";err.textContent="Không đặt được mật khẩu mới: "+r.error.message;return}
    REC=false;history.replaceState(null,"",location.pathname);
    sb.auth.getSession().then(function(s){if(s.data.session)enter(s.data.session.user);else showLoginGate()})})}},[
  h("label",{},"Mật khẩu mới"),a.wrap,h("label",{style:"margin-top:16px"},"Nhập lại"),b.wrap,err,btn]);
 lgShell([h("div",{style:"font-weight:700;margin-bottom:12px"},"Đặt mật khẩu mới"),f])}
function showDenied(user){lgShell([h("div",{style:"font-weight:700;margin-bottom:8px"},"Chưa được cấp quyền"),
 h("p",{class:"muted"},"Tài khoản "+user.email+" chưa nằm trong danh sách nhân viên. Hãy liên hệ chủ dự án."),
 h("button",{class:"go",type:"button",onclick:function(){sb.auth.signOut()}},"Đăng xuất")])}
function enter(user){
 sb.rpc("is_staff").then(function(r){
  if(r.data===true){READY=true;ME=user.email;document.getElementById("gate").style.display="none";load()}else showDenied(user)})}
function startRemote(){
 if(!window.supabase||!RC.SUPABASE_URL||/YOUR-/.test(RC.SUPABASE_URL+RC.SUPABASE_ANON_KEY)){lgShell([h("div",{style:"font-weight:700"},"Chưa cấu hình"),h("p",{class:"muted"},"Điền SUPABASE_URL và SUPABASE_ANON_KEY trong docs/config.js.")]);return}
 sb=window.supabase.createClient(RC.SUPABASE_URL,RC.SUPABASE_ANON_KEY,{auth:{persistSession:true,detectSessionInUrl:true}});
 sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;
  if(REC&&s){showNewPassword();return}
  if(s)enter(s.user);else showLoginGate()});
 sb.auth.onAuthStateChange(function(ev,s){
  if(ev==="PASSWORD_RECOVERY"){REC=true;showNewPassword();return}
  if(ev==="SIGNED_IN"&&s&&!READY&&!REC)enter(s.user);
  if(ev==="SIGNED_OUT")location.reload()});
 setInterval(function(){if(READY&&!document.hidden)load(true)},60000)}

startRemote();
setInterval(function(){if(!document.hidden&&S&&(S.job.running||tab==="run"))load(true)},3000);
</script>
